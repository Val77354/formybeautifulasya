<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="For My Beautiful Asya">
<meta property="og:description" content="A little night sky, made by Valeri.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>For My Beautiful Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap">
<style>
  /* Layout: one night sky on a full-screen canvas; each chapter's words sit in a glass panel at the bottom, its game above. */
  :root {
    color-scheme: dark;
    --night: #0b0510;
    --plum: #26102a;
    --rose: #ff4d7d;
    --blush: #ffb8ca;
    --gold: #f6c97b;
    --paper: #fbf3ea;
    --sepia: #4a2a2a;
    --ink: #f8eef3;
    --dim: rgba(248, 238, 243, 0.64);
    --faint: rgba(248, 238, 243, 0.15);
    --glass: rgba(30, 14, 34, 0.58);
    --display: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --hand: 'Caveat', 'Bradley Hand', 'Segoe Print', cursive;
  }
  html, body { height: 100%; }
  body {
    background: var(--night); color: var(--ink); overflow: hidden;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  canvas#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .path { display: flex; align-items: center; gap: 0; }
  .path i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .5s, box-shadow .5s; }
  .path b { width: 16px; height: 1px; background: var(--faint); transition: background .5s; }
  .path i.lit { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .path b.lit { background: rgba(246, 201, 123, .6); }
  .path i.now { background: var(--rose); box-shadow: 0 0 12px var(--rose); }
  .mute {
    pointer-events: auto; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
    background: var(--glass); border: 1px solid var(--faint); border-radius: 999px; padding: 7px 12px; cursor: pointer;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
    padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  }
  .card {
    max-width: 30rem; margin: 0 auto; padding: 18px 20px 16px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(42, 18, 46, .62), rgba(20, 8, 24, .72));
    border: 1px solid rgba(255, 184, 202, .16);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    display: flex; flex-direction: column; gap: 8px; text-align: center;
    transition: opacity .6s ease, transform .6s ease;
  }
  .card.out { opacity: 0; transform: translateY(14px); }
  .chapter { font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  .title { font-family: var(--display); font-size: clamp(28px, 7.6vw, 38px); line-height: 1.08; text-wrap: balance; }
  .title i { color: var(--blush); }
  .body { font-family: var(--display); font-style: italic; font-size: clamp(17px, 4.6vw, 20px); line-height: 1.35; color: var(--dim); text-wrap: balance; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .actions:empty { display: none; }
  .btn {
    pointer-events: auto; font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
    color: var(--night); background: linear-gradient(180deg, #ffd9a0, var(--gold)); border: 0; border-radius: 999px; padding: 12px 20px;
    box-shadow: 0 6px 22px rgba(246, 201, 123, .35);
  }
  .btn.ghost { color: var(--ink); background: transparent; border: 1px solid var(--faint); box-shadow: none; }
  .btn:focus-visible, .mute:focus-visible { outline: 2px solid var(--blush); outline-offset: 3px; }
  .hint { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); min-height: 1em; }
  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 4; width: min(88vw, 26rem);
    transform: translate(-50%, -12px); opacity: 0; pointer-events: none; transition: opacity .5s ease, transform .5s ease;
    padding: 14px 18px; border-radius: 20px; text-align: center;
    background: linear-gradient(180deg, rgba(255, 233, 196, .95), rgba(246, 201, 123, .92)); color: #3a1f12;
    box-shadow: 0 14px 40px rgba(246, 201, 123, .3);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
  .toast span { font-family: var(--display); font-size: 21px; line-height: 1.2; }
  .extra { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .extra > * { pointer-events: auto; }
  /* chapter III slider */
  .slider { position: fixed; left: 50%; transform: translateX(-50%); width: min(84vw, 24rem); display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .eq { font-family: var(--mono); font-size: clamp(11.5px, 3.3vw, 14px); color: var(--blush); text-align: center; line-height: 1.5; }
  .eq b { color: var(--gold); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; touch-action: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--rose), var(--gold)); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--rose), var(--gold)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -13px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 6px rgba(255, 77, 125, .35), 0 0 22px var(--rose); }
  input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 6px rgba(255, 77, 125, .35), 0 0 22px var(--rose); }
  input[type=range]:focus-visible { outline: 2px solid var(--blush); outline-offset: 4px; border-radius: 8px; }
  /* chapter V letter */
  .letter {
    position: relative; width: min(90vw, 25rem); max-height: 62vh; margin-top: -14vh; border-radius: 6px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 10%, #fffaf3, var(--paper) 60%, #f1e2cf); color: var(--sepia);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55); transform: rotate(-1.2deg);
  }
  .letter .text { padding: 26px 24px 30px; font-family: var(--hand); font-size: 23px; line-height: 1.32; overflow-y: auto; max-height: 62vh; }
  .letter .text p { margin: 0 0 12px; }
  .letter .sign { text-align: right; font-size: 27px; color: #b3274f; }
  .letter canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; transition: opacity 1s ease; }
  /* chapter VI question */
  .ask { display: flex; gap: 14px; margin-top: -10vh; }
  .yes, .no { font-family: var(--display); font-size: 24px; border-radius: 999px; padding: 12px 28px; cursor: pointer; border: 0; }
  .yes { background: linear-gradient(180deg, #ff7a9c, var(--rose)); color: #fff; box-shadow: 0 10px 34px rgba(255, 77, 125, .5); }
  .no { background: rgba(255, 255, 255, .08); color: var(--ink); border: 1px solid var(--faint); transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
  /* finale coupons */
  .coupons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(92vw, 26rem); margin-top: -18vh; }
  .coupon {
    position: relative; min-height: 112px; padding: 14px 12px; border-radius: 16px; cursor: pointer; text-align: left;
    font-family: var(--display); font-size: 19px; line-height: 1.15; color: #3a1f12; border: 0;
    background: linear-gradient(160deg, #fff4e2, #f6d9a6); box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    -webkit-mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
    transition: transform .5s ease, opacity .5s ease;
  }
  .coupon small { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: #a3542f; margin-bottom: 6px; }
  .coupon.dim { opacity: .25; transform: scale(.94); }
  .coupon.picked { transform: scale(1.04) rotate(-1deg); background: linear-gradient(160deg, #ffe0ea, #ffb8ca); }
  .coupon:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .hold { position: relative; width: 132px; height: 132px; border: 0; background: none; padding: 0; cursor: pointer; touch-action: none; -webkit-touch-callout: none; margin-top: -14vh; }
  .hold svg { width: 100%; height: 100%; overflow: visible; }
  .hold:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; border-radius: 50%; }
  /* album */
  .album { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-bottom: 26vh; }
  .stack { position: relative; width: min(76vw, 330px); aspect-ratio: 0.82; touch-action: none; }
  .pola {
    position: absolute; inset: 0; background: #fbf7f0; border-radius: 4px; padding: 10px 10px 0;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55); display: flex; flex-direction: column;
    transition: transform .7s cubic-bezier(.2, .9, .3, 1.1), opacity .6s ease; will-change: transform;
  }
  .pola img { width: 100%; flex: 1; min-height: 0; object-fit: cover; border-radius: 2px; background: #e9dfd3; display: block; -webkit-user-drag: none; pointer-events: none; }
  .pola .cap { font-family: var(--hand); font-size: 24px; color: #3a2430; text-align: center; padding: 6px 4px 8px; min-height: 46px; line-height: 1.1; }
  .albnav { display: flex; align-items: center; gap: 18px; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--dim); }
  .albnav button { pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--faint); background: var(--glass); color: var(--ink); font-size: 22px; cursor: pointer; }
  .albnav button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .album.heart .pola .cap { font-size: 0; min-height: 10px; }
  .album.heart .albnav { visibility: hidden; }
  @media (prefers-reduced-motion: reduce) { .pola { transition: none; } }
  @media (prefers-reduced-motion: reduce) { .card, .toast, .coupon, .no { transition: none; } }
</style>

</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<div class="hud">
  <div class="path" id="path" aria-hidden="true"></div>
  <button class="mute" id="mute" hidden>♪ on</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><small id="toastN"></small><span id="toastT"></span></div>

<div class="extra" id="extra"></div>

<div class="panel">
  <div class="card" id="card" aria-live="polite">
    <div class="chapter" id="chapter">For you</div>
    <div class="title" id="title">Drawn For You</div>
    <div class="body" id="body">A small night sky, made by hand, for a not-so-great day.</div>
    <div class="actions" id="actions"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
(() => {
  // ================= setup =================
  const $ = (id) => document.getElementById(id);
  const cv = $('sky'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = 1, neb = null;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const backOut = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const heartX = (t) => 16 * Math.pow(Math.sin(t), 3);
  const heartY = (t) => -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  const beat = (s) => { const b = s % 1.15; return Math.exp(-Math.pow((b - 0.1) / 0.05, 2)) + 0.55 * Math.exp(-Math.pow((b - 0.33) / 0.06, 2)); };

  const NAME = 'Asya';
  // Album photos: whatever is in the site's photos/ folder. File names become captions
  // ("01 our first date.jpg" -> "our first date"); camera names like IMG_1234 get no caption.
  let PHOTOS = [];
  // photos/list.json names them in order; without it, ask GitHub what's in the folder.
  fetch('photos/list.json', { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((names) => names.map((name) => ({ name })))
    .catch(() => fetch('https://api.github.com/repos/Val77354/formybeautifulasya/contents/photos', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : [])))
    .then((list) => {
      PHOTOS = (Array.isArray(list) ? list : [])
        .filter((f) => /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
        .map((f) => {
          let cap = f.name.replace(/\.[^.]+$/, '').replace(/^\d+[\s._-]*/, '').replace(/[_-]+/g, ' ').trim();
          if (/^(img|dsc|pxl|photo|image|whatsapp|telegram|screenshot)\b/i.test(cap) || !/\p{L}/u.test(cap)) cap = '';
          return { src: 'photos/' + encodeURIComponent(f.name), cap };
        });
      PHOTOS.slice(0, 4).forEach((ph) => { const im = new Image(); im.src = ph.src; });
    })
    .catch(() => {});
  const FROM = 'Valeri';

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // A painted nebula, drawn once per size.
    neb = document.createElement('canvas'); neb.width = cv.width; neb.height = cv.height;
    const n = neb.getContext('2d'); n.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g0 = n.createLinearGradient(0, 0, 0, H); g0.addColorStop(0, '#07040d'); g0.addColorStop(0.55, '#140819'); g0.addColorStop(1, '#2a0f27');
    n.fillStyle = g0; n.fillRect(0, 0, W, H);
    const blob = (x, y, r, c) => { const g = n.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); n.fillStyle = g; n.fillRect(0, 0, W, H); };
    blob(W * 0.2, H * 0.25, W * 0.7, 'rgba(110,40,140,0.28)');
    blob(W * 0.85, H * 0.15, W * 0.55, 'rgba(255,77,125,0.13)');
    blob(W * 0.6, H * 0.7, W * 0.8, 'rgba(70,40,150,0.22)');
    blob(W * 0.1, H * 0.9, W * 0.6, 'rgba(255,120,150,0.12)');
  }
  addEventListener('resize', resize); resize();

  // ================= sound (made in the browser, starts only on her tap) =================
  let AC = null, master = null, wet = null, musicOn = false, pad = null;
  const SCALE = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
  function audioStart() {
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
      // a soft echo for space
      const d = AC.createDelay(1); d.delayTime.value = 0.33; const fb = AC.createGain(); fb.gain.value = 0.35;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      wet = AC.createGain(); wet.gain.value = 0.35;
      wet.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(master);
    } catch { AC = null; }
  }
  function chime(i, vol = 0.16) {
    if (!AC || !musicOn) return;
    const f = SCALE[((i % SCALE.length) + SCALE.length) % SCALE.length];
    const t = AC.currentTime;
    for (const [mult, type, v] of [[1, 'sine', 1], [2, 'triangle', 0.18], [3.01, 'sine', 0.06]]) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f * mult;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
      o.connect(g); g.connect(master); g.connect(wet); o.start(t); o.stop(t + 2.3);
    }
  }
  function chord(root = 0) { [0, 2, 4, 7].forEach((s, k) => setTimeout(() => chime(root + s, 0.12), k * 110)); }
  function padStart() {
    if (!AC || pad) return;
    const g = AC.createGain(); g.gain.value = 0; g.connect(master);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(g);
    const voices = [130.81, 196, 261.63, 329.63].flatMap((f) => [f, f * 1.004]).map((f) => { const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(lp); o.start(); return o; });
    const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 0.012; lfo.connect(lg); lg.connect(g.gain); lfo.start();
    g.gain.linearRampToValueAtTime(0.03, AC.currentTime + 4);
    pad = { g, voices, lfo };
    // a slow music-box melody, one note every couple of seconds
    let step = 0; const tune = [2, 4, 5, 4, 2, 1, 2, 4, 7, 5, 4, 2];
    pad.timer = setInterval(() => { if (musicOn) chime(tune[step++ % tune.length], 0.05); }, 2200);
  }
  function setMusic(on) {
    musicOn = on; $('mute').hidden = false; $('mute').textContent = on ? '♪ on' : '♪ off';
    if (on) { audioStart(); AC?.resume?.(); padStart(); }
    if (pad && AC) pad.g.gain.linearRampToValueAtTime(on ? 0.03 : 0, AC.currentTime + 0.6);
  }
  $('mute').addEventListener('click', (e) => { e.stopPropagation(); setMusic(!musicOn); });

  // ================= the sky (every scene) =================
  const stars = Array.from({ length: 190 }, () => ({ x: Math.random(), y: Math.random(), z: rand(0.2, 1), p: rand(0, 6.28), s: rand(0.4, 1.6) }));
  const shooting = [];
  let sparks = [];
  function drawSky(now, dt) {
    ctx.drawImage(neb, 0, 0, W, H);
    for (const s of stars) {
      const tw = reduce ? 0.75 : 0.4 + 0.6 * Math.sin(now * s.s + s.p) ** 2;
      const y = ((s.y + (reduce ? 0 : now * 0.004 * s.z)) % 1) * H;
      ctx.fillStyle = `rgba(255,236,246,${0.7 * tw * s.z})`;
      ctx.beginPath(); ctx.arc(s.x * W, y, 0.5 + s.z * 1.1, 0, 6.283); ctx.fill();
    }
    // the moon, top right
    const mx = W * 0.82, my = H * 0.13, mr = Math.min(W, H) * 0.045;
    const mg = ctx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 4); mg.addColorStop(0, 'rgba(255,230,210,0.22)'); mg.addColorStop(1, 'rgba(255,230,210,0)');
    ctx.fillStyle = mg; ctx.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    ctx.fillStyle = '#fff1df'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(11,5,16,0.9)'; ctx.beginPath(); ctx.arc(mx + mr * 0.45, my - mr * 0.2, mr * 0.92, 0, 6.283); ctx.fill();
    // shooting stars now and then
    if (!reduce && Math.random() < dt * 0.12) shooting.push({ x: rand(0, W), y: rand(0, H * 0.4), vx: rand(380, 560), vy: rand(120, 220), life: 1 });
    for (const s of shooting) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 1.4;

        <p>I know today isn’t a good one. You don’t have to explain it, or fix it, or pretend to be okay for me.</p>
        <p>The bad days don’t make me love you any less. If anything I love you a little more on them, because I get to see all of you, not just the easy parts.</p>
        <p>So rest. Eat something nice. Let the world wait for a bit.</p>
        <p>And when you’re ready, I’ll be right here, with a hug that lasts too long and terrible jokes on standby.</p>
        <p class="sign">Always yours,<br>${FROM} ♥</p>
      </div><canvas id="foil"></canvas></div>`;
      const letter = $('letter'), foil = $('foil');
      const rect = letter.getBoundingClientRect();
      foil.width = Math.round(rect.width * DPR); foil.height = Math.round(rect.height * DPR);
      const f = foil.getContext('2d'); f.setTransform(DPR, 0, 0, DPR, 0, 0);
      const g = f.createLinearGradient(0, 0, rect.width, rect.height);
      g.addColorStop(0, '#b8862f'); g.addColorStop(0.3, '#f6d58b'); g.addColorStop(0.5, '#fff1c9'); g.addColorStop(0.7, '#e2b25a'); g.addColorStop(1, '#a87726');
      f.fillStyle = g; f.fillRect(0, 0, rect.width, rect.height);
      for (let i = 0; i < 900; i++) { f.fillStyle = `rgba(255,255,255,${Math.random() * 0.25})`; f.fillRect(Math.random() * rect.width, Math.random() * rect.height, 1.2, 1.2); }
      f.fillStyle = 'rgba(90,50,15,0.75)'; f.textAlign = 'center'; f.font = 'italic 26px "Instrument Serif", Georgia, serif';
      f.fillText('for your eyes only', rect.width / 2, rect.height / 2 - 6);
      f.font = '11px "JetBrains Mono", monospace'; f.fillText('SCRATCH GENTLY', rect.width / 2, rect.height / 2 + 18);
      heartPathOn(f, rect.width / 2, rect.height / 2 - 52, 1.1);
      f.globalCompositeOperation = 'destination-out';
      let last = null, strokes = 0;
      const pos = (e) => { const r = foil.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      const scratch = (p) => {
        f.lineCap = 'round'; f.lineWidth = 38; f.beginPath(); f.moveTo((last || p).x, (last || p).y); f.lineTo(p.x, p.y); f.stroke();
        last = p;
        if (++strokes % 12 === 0) { if (Math.random() < 0.5) chime(Math.floor(rand(0, 9)), 0.04); this.check(f, foil); }
      };
      foil.addEventListener('pointerdown', (e) => { e.preventDefault(); foil.setPointerCapture?.(e.pointerId); last = null; scratch(pos(e)); });
      foil.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') { if (last !== null || e.buttons) scratch(pos(e)); } });
      foil.addEventListener('pointerup', () => { last = null; this.check(f, foil); });
    },
    check(f, foil) {
      if (this.revealed) return;
      const data = f.getImageData(0, 0, foil.width, foil.height).data;
      let clear = 0, total = 0;
      for (let i = 3; i < data.length; i += 4 * 40) { total++; if (data[i] < 40) clear++; }
      if (clear / total > 0.5) {
        this.revealed = true; foil.style.opacity = 0; setTimeout(() => foil.remove(), 1000); chord(1);
        hint('');
        setTimeout(() => say({ chapter: 'Chapter V · done', title: 'I meant <i>every word</i>.', body: '', actions: nextBtn() }), 1200);
      }
    },
    leave() { extra.innerHTML = ''; },
    draw() {},
  });
  // Points that trace a word, for stars to fly into.
  function textPoints(word, size, cy, style = '') {
    const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `${style} ${size}px "Instrument Serif", Georgia, serif`;
    g.fillText(word, W / 2, cy);
    const data = g.getImageData(0, 0, W, H).data, step = Math.max(3, Math.round(size / 26)), pts = [];
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) if (data[(y * W + x) * 4 + 3] > 140) pts.push({ x, y, sx: W / 2 + rand(-40, 40), sy: H * 0.55 + rand(-40, 40), d: rand(0, 0.8), r: rand(0.9, 1.7), tw: rand(0, 6.28), gold: Math.random() < 0.2 });
    return pts;
  }
  function heartPathOn(c, cx, cy, k) { c.fillStyle = 'rgba(179,39,79,0.8)'; c.beginPath(); for (let i = 0; i <= 80; i++) { const t = (i / 80) * 6.283; const x = cx + heartX(t) * k, y = cy + heartY(t) * k; i ? c.lineTo(x, y) : c.moveTo(x, y); } c.fill(); }

  // ---------- VI. one question ----------
  scenes.push({
    enter() {
      this.tries = 0; this.yes = false; this.fw = 0;
      say({ chapter: 'Chapter VI', title: 'One small question', body: 'Will you let me cheer you up, even a little?' });
      extra.innerHTML = `<div class="ask"><button class="yes" id="yes">Yes</button><button class="no" id="no">No</button></div>`;
      const no = $('no');
      const LABELS = ['No', 'Are you sure?', 'Really sure?', 'Think again', 'Last chance…'];
      const dodge = (e) => {
        if (this.yes) return;
        e.preventDefault(); e.stopPropagation();
        if (no.className === 'yes') { this.say_yes(); return; }
        this.tries++;
        if (this.tries >= LABELS.length) { no.textContent = 'Yes ♥'; no.className = 'yes'; no.style.transform = ''; no.onclick = () => this.say_yes(); return; }
        no.textContent = LABELS[this.tries];
        const dx = rand(-0.32, 0.32) * W, dy = rand(-0.22, 0.08) * H;
        no.style.transform = `translate(${dx}px, ${dy}px) rotate(${rand(-12, 12)}deg)`;
        chime(this.tries - 1, 0.05);
      };
      no.addEventListener('pointerdown', dodge);
      no.addEventListener('mouseenter', dodge);
      no.addEventListener('click', (e) => { e.stopPropagation(); if (no.className === 'yes') this.say_yes(); });
      $('yes').addEventListener('click', (e) => { e.stopPropagation(); this.say_yes(); });
    },
    say_yes() {
      if (this.yes) return;
      this.yes = true; extra.innerHTML = ''; chord(0); setTimeout(() => chord(4), 500);
      say({ chapter: 'Chapter VI · done', title: 'Best answer. <i>Look up.</i>', body: '' });
      setTimeout(() => say({ chapter: 'Chapter VI · done', title: 'Best answer. <i>Look up.</i>', body: 'Tap the sky for more.', actions: nextBtn('One last thing') }), 3200);
    },
    leave() { extra.innerHTML = ''; },
    draw(t, now, dt) {
      if (!this.yes) { glowHeart(W / 2, H * 0.3, Math.min(W, H) * 0.004 * (1 + 0.1 * beat(now)), 'rgba(255,77,125,0.8)', 30); return; }
      this.fw -= dt;
      if (this.fw <= 0 && t < 600) { this.fw = rand(0.35, 0.8); heartFirework(rand(0.2, 0.8) * W, rand(0.15, 0.45) * H); }
    },
    down(x, y) { if (this.yes) heartFirework(x, y); },
  });

  // ---------- finale ----------
  const COUPONS = [
    ['A hug that lasts', 'way too long'],
    ['Movie night.', 'You pick. Zero complaints.'],
    ['Your favourite food,', 'delivered by me'],
    ['One whole day', 'where you’re the boss'],
  ];
  scenes.push({
    enter() {
      this.picked = false; this.hugged = false; this.floaters = [];
      say({ chapter: 'Finale', title: 'Pick a <i>prize</i>', body: 'One coupon. Choose carefully, or don’t. I’ll honour all of them anyway.' });
      extra.innerHTML = `<div class="coupons" id="coupons">${COUPONS.map((c, i) => `<button class="coupon" data-i="${i}"><small>${FROM} → ${NAME} · Nº ${String(i + 1).padStart(2, '0')}</small>${c[0]}<br><i>${c[1]}</i></button>`).join('')}</div>`;
      document.querySelectorAll('.coupon').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); this.pick(b); }));
    },
    pick(b) {
      if (this.picked) return;
      this.picked = true; chord(2);
      const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 40);
      document.querySelectorAll('.coupon').forEach((c) => c.classList.add(c === b ? 'picked' : 'dim'));
      const date = new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
      b.querySelector('small').textContent = `Redeemed · ${date}`;
      say({ chapter: 'Finale', title: 'Redeemed. <i>Valid forever.</i>', body: 'Take a screenshot and show it to me. No expiry date, no small print.', actions: [{ label: 'And one more thing', go: () => this.hugStep() }] });
    },
    hugStep() {
      extra.innerHTML = `<button class="hold" id="hold" aria-label="Press and hold the heart for a hug"><svg viewBox="-20 -20 40 40" aria-hidden="true"><defs><clipPath id="hc"><path id="hp"></path></clipPath></defs><path id="ho" fill="none" stroke="#ff4d7d" stroke-width="1.2"></path><rect id="hf" x="-20" y="20" width="40" height="40" fill="#ff4d7d" clip-path="url(#hc)"></rect></svg></button>`;
      let d = ''; for (let i = 0; i <= 120; i++) { const t = (i / 120) * 6.283; d += `${i ? 'L' : 'M'}${(heartX(t) * 1.05).toFixed(2)} ${(heartY(t) * 1.05 + 1).toFixed(2)}`; } d += 'Z';
      $('hp').setAttribute('d', d); $('ho').setAttribute('d', d);
      say({ chapter: 'Finale', title: 'Press and hold <i>the heart</i>', body: 'Keep holding. This is a hug, and hugs take a second.' });
      const hold = $('hold'); let holding = false, start = 0, raf = 0;
      const fill = (p) => $('hf').setAttribute('y', String(20 - 40 * p));
      const loop = () => {
        if (!holding) return;
        const p = clamp((performance.now() - start) / 2600); fill(p);
        if (Math.random() < 0.3) { const r = hold.getBoundingClientRect(); sparks.push({ x: r.left + r.width / 2 + rand(-60, 60), y: r.top + r.height / 2 + rand(-60, 60), vx: 0, vy: -20, life: 1, decay: 1.2, r: 1.6, c: '#ffb8ca' }); }
        if (p >= 1) return this.hug();
        raf = requestAnimationFrame(loop);
      };
      hold.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); holding = true; start = performance.now(); hold.setPointerCapture?.(e.pointerId); chime(0, 0.08); loop(); });
      const rel = (e) => { e.stopPropagation(); if (!holding) return; holding = false; cancelAnimationFrame(raf); fill(0); };
      hold.addEventListener('pointerup', rel); hold.addEventListener('pointercancel', rel);
      hold.addEventListener('click', (e) => e.stopPropagation());
      hold.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.hug(); } });
    },
    hug() {
      if (this.hugged) return;
      this.hugged = true; extra.innerHTML = ''; chord(0); setTimeout(() => chord(2), 400); setTimeout(() => chord(4), 800);
      for (let i = 0; i < 5; i++) setTimeout(() => heartFirework(rand(0.2, 0.8) * W, rand(0.2, 0.45) * H, rand(8, 12)), i * 280);
      const endActions = [{ label: 'Play it again', ghost: true, go: () => go(1) }];
      if (PHOTOS.length) endActions.unshift({ label: 'Our album ♥', go: () => go(ALBUM) });
      say({ chapter: 'The end, for now', title: `That’s how much, <i>${NAME}</i>.`, body: `I love you. On the good days, and especially on the grey ones. — ${FROM}`, actions: endActions });
      // Stars fly in and spell her name across the sky.
      setTimeout(() => { this.word = [...textPoints(NAME, Math.min(W * 0.32, 150), H * 0.22, 'italic'), ...textPoints(`love, ${FROM}`, Math.min(W * 0.09, 40), H * 0.22 + Math.min(W * 0.2, 96), 'italic')]; this.wordAt = performance.now() / 1000; chord(4); }, 1600);
    },
    leave() { extra.innerHTML = ''; },
    draw(t, now, dt) {
      if (!reduce && Math.random() < 0.07) this.floaters.push({ x: rand(0.05, 0.95) * W, y: H + 20, vy: rand(20, 45), s: rand(0.3, 0.7), w: rand(0, 6), life: 1, gold: Math.random() < 0.25 });
      for (const f of this.floaters) { f.y -= f.vy * dt; f.x += Math.sin(now * 1.4 + f.w) * 0.3; glowHeart(f.x, f.y, f.s, f.gold ? 'rgba(246,201,123,0.8)' : 'rgba(255,77,125,0.7)', 10); }
      this.floaters = this.floaters.filter((f) => f.y > -30);
      if (this.hugged && !this.word) glowHeart(W / 2, H * 0.32, Math.min(W, H) * 0.0075 * (1 + 0.09 * beat(now)), 'rgba(255,77,125,0.95)', 44);
      if (this.word) {
        const wt = now - this.wordAt;
        for (const p of this.word) {
          const q = reduce ? 1 : easeOut(clamp((wt - p.d) / 1.8));
          const x = p.sx + (p.x - p.sx) * q, y = p.sy + (p.y - p.sy) * q;
          const tw = 0.6 + 0.4 * Math.sin(now * 3 + p.tw);
          ctx.fillStyle = p.gold ? `rgba(246,201,123,${tw})` : `rgba(255,${150 + Math.round(60 * tw)},${185},${0.95})`;
          ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.283); ctx.fill();
        }
      }
    },
    down(x, y) { if (this.hugged) heartFirework(x, y); },
  });

  // ---------- album ----------
  const ALBUM = scenes.length;
  scenes.push({
    enter() {
      this.i = 0; this.whole = false; this.floaters = [];
      say({ chapter: 'Our album', title: `${NAME} & ${FROM}`, body: 'Swipe, or use the arrows.', hint: '' });
      extra.innerHTML = `<div class="album" id="album"><div class="stack" id="stack">${PHOTOS.map((ph, i) => `<div class="pola" data-i="${i}"><img src="${ph.src}" alt="${ph.cap || 'Us'}" loading="${i < 3 ? 'eager' : 'lazy'}" decoding="async"><div class="cap">${ph.cap}</div></div>`).join('')}</div><div class="albnav"><button id="prev" aria-label="Previous photo">‹</button><span id="count"></span><button id="nextp" aria-label="Next photo">›</button></div></div>`;
      this.cards = [...document.querySelectorAll('.pola')];
      this.tilt = this.cards.map(() => rand(-7, 7));
      $('prev').addEventListener('click', (e) => { e.stopPropagation(); this.show(this.i - 1); });
      $('nextp').addEventListener('click', (e) => { e.stopPropagation(); this.show(this.i + 1); });
      const stack = $('stack'); let sx = null;
      stack.addEventListener('pointerdown', (e) => { sx = e.clientX; stack.setPointerCapture?.(e.pointerId); });
      stack.addEventListener('pointerup', (e) => { if (sx === null) return; const dx = e.clientX - sx; sx = null; this.show(this.i + (Math.abs(dx) > 40 && dx > 0 ? -1 : 1)); });
      this.show(0, true);
    },
    show(i, quiet) {
      if (this.whole) return;
      if (i >= PHOTOS.length) return this.heart();
      this.i = Math.max(0, i);
      this.cards.forEach((c, k) => {
        const d = k - this.i;
        if (d < 0) { c.style.transform = `translate(-130vw, -6vh) rotate(${-25 + this.tilt[k]}deg)`; c.style.opacity = 0; c.style.zIndex = 0; }
        else { c.style.transform = `translate(${d * 6}px, ${d * 5}px) rotate(${this.tilt[k] * (d ? 1 : 0.35)}deg) scale(${1 - Math.min(d, 4) * 0.03})`; c.style.opacity = d > 4 ? 0 : 1; c.style.zIndex = 100 - d; }
      });
      $('count').textContent = `${this.i + 1} / ${PHOTOS.length}`;
      if (!quiet) { chime(this.i + 2, 0.09); const r = $('stack').getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height * 0.85, 14); }
      hint(this.i === PHOTOS.length - 1 ? 'tap once more' : '');
    },
    heart() {
      this.whole = true; chord(2); setTimeout(() => chord(4), 450);
      $('album').classList.add('heart');
      const n = this.cards.length, r = $('stack').getBoundingClientRect();
      const k = Math.min(W * 0.021, H * 0.0125), s = Math.min(0.32, (32 * k) / (r.width * 3.4));
      this.cards.forEach((c, j) => {
        const t = (j / n) * 6.283;
        const x = W / 2 + heartX(t) * k - (r.left + r.width / 2), y = H * 0.32 + heartY(t) * k - (r.top + r.height / 2);
        c.style.opacity = 1; c.style.zIndex = j;
        setTimeout(() => { c.style.transform = `translate(${x}px, ${y}px) rotate(${this.tilt[j]}deg) scale(${s})`; }, j * 90);
      });
      say({ chapter: 'Our album', title: 'Every one of these is <i>my favourite</i>.', body: `And there are so many more to make. — ${FROM}`, actions: [{ label: 'Look again', ghost: true, go: () => go(ALBUM) }, { label: 'Start from the beginning', ghost: true, go: () => go(1) }] });
    },
    leave() { extra.innerHTML = ''; },
    draw(t, now, dt) {
      if (!reduce && Math.random() < 0.05) this.floaters.push({ x: rand(0.05, 0.95) * W, y: H + 20, vy: rand(20, 45), s: rand(0.3, 0.6), w: rand(0, 6) });
      for (const f of this.floaters) { f.y -= f.vy * dt; f.x += Math.sin(now * 1.4 + f.w) * 0.3; glowHeart(f.x, f.y, f.s, 'rgba(255,77,125,0.6)', 10); }
      this.floaters = this.floaters.filter((f) => f.y > -30);
    },
  });

  // ================= progress path =================
  const path = $('path');
  path.innerHTML = ROMAN.map((_, i) => `${i ? '<b></b>' : ''}<i></i>`).join('');
  function updatePath() {
    const dots = path.querySelectorAll('i'), lines = path.querySelectorAll('b');
    dots.forEach((d, i) => { d.classList.toggle('lit', i < current - 1 || current >= ROMAN.length + 1); d.classList.toggle('now', i === current - 1 && current <= ROMAN.length); });
    lines.forEach((l, i) => l.classList.toggle('lit', i < current - 1 || current >= ROMAN.length + 1));
    path.style.opacity = current === 0 ? 0 : 1;
  }

  // ================= flow =================
  let current = 0, sceneStart = performance.now();
  function go(i) {
    scenes[current].leave?.();
    current = i; sceneStart = performance.now(); sparks = [];
    scenes[i].enter?.();
    updatePath();
  }
  function next() { go(Math.min(current + 1, scenes.length - 1)); }

  // pointer → current scene (buttons and the letter handle their own)
  const isUi = (e) => e.target.closest('button, input, .letter, .card');
  let down = false;
  addEventListener('pointerdown', (e) => { if (isUi(e)) return; down = true; audioStart(); scenes[current].down?.(e.clientX, e.clientY); });
  addEventListener('pointermove', (e) => { if (!down) return; scenes[current].move?.(e.clientX, e.clientY); });
  addEventListener('pointerup', (e) => { if (!down) return; down = false; scenes[current].up?.(e.clientX, e.clientY); });

  let last = performance.now();
  function frame(ms) {
    const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
    const now = ms / 1000;
    ctx.clearRect(0, 0, W, H);
    drawSky(now, dt);
    scenes[current].draw?.((ms - sceneStart) / 1000, now, dt);
    drawSparks(dt);
    requestAnimationFrame(frame);
  }
  go(0);
  // "…#album" opens straight to the photos.
  if (location.hash === '#album') setTimeout(() => PHOTOS.length && go(ALBUM), 1500);
  requestAnimationFrame(frame);
})();
</script>

</body>
